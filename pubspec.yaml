name: bachaokhana
description: A Flutter app connecting food businesses with customers to rescue surplus food.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase (Realtime Database instead of Firestore — no billing/card required)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # QR codes
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Local notifications (pickup reminders, new-order alerts — no server/billing needed)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Image upload (Cloudinary — no billing/card required)
  http: ^1.2.2
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
